def getGitBranch() {
    def branch = ''
    def command = "git rev-parse --abbrev-ref HEAD"
    def process = command.execute()
    process.in.eachLine { line -> branch = line }
    process.err.eachLine { line -> println "Error: " + line } // Optional: print errors
    process.waitFor()
    return branch.trim()
}

import java.text.SimpleDateFormat

task generateProperties {
    def outputDir = file("$buildDir/generated-resources/main")

    // Explicitly declare the output directory for the task
    outputs.dir outputDir

    // Define local variables to hold the values, and also register them as inputs
    def buildHostValue = System.getenv('COMPUTERNAME') ?: InetAddress.localHost.hostName
    def buildUserValue = System.getProperty('user.name')
    def buildTimestampValue = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss").format(new Date())
    def gitBranchValue = getGitBranch()

    inputs.property('buildHost', buildHostValue)
    inputs.property('buildUser', buildUserValue)
    inputs.property('buildTimestamp', buildTimestampValue)
    inputs.property('gitBranch', gitBranchValue)

    doLast {
        outputDir.mkdirs() // Ensure the directory exists
        def buildInfoFile = file("$outputDir/buildInfo.properties")

        buildInfoFile.text = """
            build.host=${buildHostValue}
            build.user=${buildUserValue}
            build.timestamp=${buildTimestampValue}
            build.branch=${gitBranchValue}
        """.stripIndent()
    }
}

// Ensure this task is run before processing resources
sourceSets {
    main {
        output.dir generateProperties.outputs.files, builtBy: generateProperties
    }
}
